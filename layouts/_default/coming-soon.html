{{ define "main" }}
{{ partial "sidebar.html" (dict "context" . "disableSidebar" true "displayPlaceholder" false) }}
<div class="coming-soon-wrapper flex justify-center items-center min-h-[100vh] py-8">
  <div class="coming-soon-panel relative bg-gray-200/80 backdrop-blur-md rounded-xl shadow-xl shadow-purple-300/30 p-10 max-w-lg w-11/12 text-center z-10">
    <img src="{{ "images/logo.svg" | relURL }}" alt="Logo" class="background-logo absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4/5 max-w-[500px] opacity-40 blur-sm z-0 pointer-events-none">
    <div class="content-wrapper relative z-20">
      {{ .Content }}
    </div>
  </div>
</div>

<style>
  .coming-soon-content h1 {
    @apply text-4xl font-bold text-gray-800 mb-5;
  }

  .coming-soon-content p {
    @apply text-lg text-gray-600 leading-relaxed;
  }

  @media (max-width: 768px) {
    .coming-soon-panel {
      @apply p-6 w-full;
    }

    .background-logo {
      @apply w-11/12 max-w-[500px];
    }

    .coming-soon-content h1 {
      @apply text-3xl;
    }

    .coming-soon-content p {
      @apply text-base;
    }
  }
</style>
{{ end }}
