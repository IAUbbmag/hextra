{{ range .Params.linkedin }}
<!-- Main container with gradient background, border radius, and padding -->
<div class="container mx-auto bg-gradient-to-r from-blue-900 to-blue-600 rounded-[30px] shadow-lg max-w-[1288px] flex items-center justify-between p-[25px] relative overflow-visible h-[165px]">
  <!-- Image section (left side in desktop) -->
  <div class="relative z-10 mr-4">
    {{ with resources.Get .image }}
    <img loading="lazy" decoding="async" width="162.5" height="112.5" src="{{ .RelPermalink }}" class="max-w-full h-auto rounded-md w-[clamp(100px, 12.5vw, 162.5px)] h-[clamp(69px, 8.5vw, 112.5px)]" alt="LinkedIn Preview">
    {{ else }}
      <p class="text-center">تصویری ارائه نشده</p>
    {{ end }}
  </div>
  <!-- Text section (center in desktop) -->
  <div class="text-center flex-1 px-4 z-10">
    <h3 class="text-[clamp(18px, 4vw, 22px)] font-bold text-white">{{ .text }}</h3>
  </div>
  <!-- Button section (right side in desktop) -->
  <div class="text-left z-10">
    <a href="{{ .url }}" class="inline-flex items-center bg-white text-blue-900 font-semibold py-2 px-4 rounded-md hover:bg-blue-100 hover:shadow-[0_0_15px_rgba(0,119,181,0.7)] transition duration-300 text-[14px]">
      <svg class="w-6 h-6 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
      <span class="button-text">{{ .button }}</span>
    </a>
  </div>
</div>
{{ end }}


<!-- linkedin section -->
<!-- Responsive Styling -->
<style>
  @media (max-width: 768px) {
    .linkedin-container {
      height: auto;
      min-height: clamp(300px, 50vw, 400px);
      flex-direction: column;
      padding: 20px;
      text-align: center;
      align-items: center;
      justify-content: space-between;
    }
    .linkedin-container > div {
      width: 100%;
      margin: 0;
    }
    /* Image at the top center */
    .linkedin-container > div:nth-child(1) {
      margin: 0 auto;
      margin-bottom: 20px;
    }
    /* Text in the middle center */
    .linkedin-container > div:nth-child(2) {
      margin: 0 auto;
      flex: 1;
    }
    .linkedin-container h3 {
      word-break: break-word;
      max-width: 100%;
      box-sizing: border-box;
      margin: 0 20px;
    }
    /* Button at the bottom center */
    .linkedin-container > div:nth-child(3) {
      margin: 0 auto;
      margin-top: 20px;
    }
    .linkedin-container a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.5rem, 1vw, 0.75rem);
    }
    .linkedin-container a .button-text {
      display: none; /* Hide text in mobile */
    }
    .linkedin-container a svg {
      width: clamp(12px, 2vw, 16px);
      height: clamp(12px, 2vw, 16px);
      margin-right: 0; /* Remove margin since text is hidden */
    }
  }
</style>

<!-- linkedin section -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.linkedin-container');
    if (container) container.classList.add('linkedin-container');
  });
</script>
